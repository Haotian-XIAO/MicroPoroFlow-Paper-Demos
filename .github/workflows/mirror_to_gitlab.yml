on:
  - push
  - delete

jobs:
  mirror_to_gitlab:
    if: github.repository_owner == 'mgenet'

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Sync repo
      uses: wangchucheng/git-repo-sync@master
      with:
        target-url: https://gitlab.inria.fr/mgenet/MicroPoroFlow-Paper-Demos
        target-username: mgenet
        target-token: ${{secrets.GITLAB_TOKEN}}
